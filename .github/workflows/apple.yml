name: apple-clients

# Markdown under clients/apple is docs, not build input — no client README
# edit should cost two macOS runners.
on:
  push:
    branches: [master]
    paths:
      - "clients/apple/**"
      - "!clients/apple/**.md"
      - ".github/workflows/apple.yml"
  pull_request:
    paths:
      - "clients/apple/**"
      - "!clients/apple/**.md"
      - ".github/workflows/apple.yml"

jobs:
  # The protocol core is platform-independent — cheap Linux run first.
  kit-linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path clients/apple/GravedecayKit

  apps-macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Core tests (Darwin, includes TtydWebSocket)
        run: swift test --package-path clients/apple/GravedecayKit
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: clients/apple
        run: xcodegen --spec project.yml
      - name: Verify Universal 2 Release app
        working-directory: clients/apple
        run: |
          xcodebuild -project Gravedecay.xcodeproj -scheme Gravedecay-macOS \
            -configuration Release build -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY='' ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO -skipPackagePluginValidation
          lipo -info build/DerivedData/Build/Products/Release/Gravedecay.app/Contents/MacOS/Gravedecay
          lipo build/DerivedData/Build/Products/Release/Gravedecay.app/Contents/MacOS/Gravedecay -verify_arch arm64 x86_64
      - name: Package and inspect DMG
        working-directory: clients/apple
        run: |
          APP="$PWD/build/DerivedData/Build/Products/Release/Gravedecay.app" scripts/package-macos-dmg.sh
          MOUNT="$(mktemp -d /tmp/gravedecay-mount.XXXXXX)"
          hdiutil attach build/Gravedecay-macOS.dmg -mountpoint "$MOUNT" -nobrowse -readonly
          test -d "$MOUNT/Gravedecay.app"
          hdiutil detach "$MOUNT"
          rmdir "$MOUNT"
      - name: Confirm native macOS binary has no WebKit dependency
        run: |
          APP=clients/apple/build/DerivedData/Build/Products/Release/Gravedecay.app
          ! otool -L "$APP/Contents/MacOS/Gravedecay" | grep -q 'WebKit.framework'
      - name: Upload macOS DMG
        if: matrix.runner == 'macos-15'
        uses: actions/upload-artifact@v4
        with:
          name: Gravedecay-macOS-unsigned
          path: clients/apple/build/Gravedecay-macOS.dmg
      - name: Build iOS app (simulator)
        working-directory: clients/apple
        run: >
          xcodebuild -project Gravedecay.xcodeproj -scheme Gravedecay-iOS
          -destination "generic/platform=iOS Simulator"
          -configuration Debug build
          CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation
