name: CI

# Docs and markdown stay IN scope here: the unit suite parses README.md and
# docs/*.md as contracts (test_docs_contract, test_uninstall, test_t3_connect,
# …), so a docs-only change can legitimately fail this workflow. Only the
# Apple clients (their own workflow) are out of scope.
on:
  push:
    branches: [master]
    paths-ignore:
      - "clients/**"
      - ".github/workflows/apple.yml"
  pull_request:
    paths-ignore:
      - "clients/**"
      - ".github/workflows/apple.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Python and appliance contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # Web Push crypto (VAPID + RFC 8291) — the vector tests must RUN in CI,
      # not skip: a silent skip here would let the encryption drift unnoticed.
      - run: python -m pip install cryptography
      - run: python -m unittest discover -s tests -v
      - run: docker compose -f docker/portable/compose.yaml config --quiet
      - run: bash -n raise.sh
