name: browser

# Playwright drives the dashboard PWA only, so this is an allow-list: the
# fixture is dashboard/gravedecay.py plus its static assets, and the specs
# live under tests/browser/.
on:
  push:
    branches: [master]
    paths:
      - "dashboard/**"
      - "web/**"
      - "tests/browser/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/browser.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - "web/**"
      - "tests/browser/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/browser.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Safari-first browser matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:mobile
