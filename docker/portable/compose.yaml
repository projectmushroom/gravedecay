# Usage: COMPOSE_PROJECT_NAME=grave-a PORT=4711 docker compose up -d --build
# Project-scoped default volume names make separate project names independent.
services:
  app:
    build:
      context: ../..
      dockerfile: docker/portable/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      GRAVEDECAY_ALLOWED_USERS: ${GRAVEDECAY_ALLOWED_USERS:-}
    volumes:
      - workspace:/workspace
      # Credentials are durable but deliberately outside GRAVE_ROOT, so the
      # dashboard file manager can never browse an agent's HOME.
      - agent-home:/home/grave
    tmpfs:
      - /tmp:mode=1777
    expose: ["4711", "4712", "4713"]

  gateway:
    image: nginxinc/nginx-unprivileged:stable-alpine
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-4711}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

volumes:
  workspace:
  agent-home:
