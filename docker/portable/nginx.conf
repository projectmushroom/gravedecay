map $http_upgrade $connection_upgrade { default upgrade; '' close; }
map $http_x_forwarded_proto $forwarded_proto { default $http_x_forwarded_proto; '' $scheme; }

server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    client_max_body_size 2g;

    location = /healthz { proxy_pass http://app:4712/healthz; proxy_set_header Host $http_host; }
    location = /grave { return 301 /grave/; }
    location /grave/ {
        proxy_pass http://app:4712;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Tailscale-User-Login $http_tailscale_user_login;
        proxy_set_header Tailscale-User-ID $http_tailscale_user_id;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 190s;
    }
    location = /term { return 301 /term/; }
    location /term/ {
        proxy_pass http://app:4713;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Tailscale-User-Login $http_tailscale_user_login;
        proxy_set_header Tailscale-User-ID $http_tailscale_user_id;
        proxy_read_timeout 190s;
    }
    location / {
        proxy_pass http://app:4711;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Tailscale-User-Login $http_tailscale_user_login;
        proxy_set_header Tailscale-User-ID $http_tailscale_user_id;
        proxy_read_timeout 190s;
    }
}
